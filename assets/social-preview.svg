<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">repo-onboarding</title>
  <desc id="desc">A Claude Skill that builds a persistent, commit-tracked map of any codebase and answers questions with verified file:line evidence.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101b31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Icon: stacked map layers with a routed path -->
  <g transform="translate(96 200)">
    <rect x="0" y="34" width="84" height="84" rx="16" fill="#3b82f6" fill-opacity="0.14" stroke="#60a5fa" stroke-width="2"/>
    <rect x="18" y="52" width="48" height="48" rx="10" fill="#3b82f6" fill-opacity="0.18" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="30" cy="64" r="4" fill="#7dd3fc"/>
    <circle cx="54" cy="88" r="4" fill="#7dd3fc"/>
    <path d="M 30 64 V 80 H 54 V 88" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="210" y="252" font-size="68" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">repo-onboarding</text>
  <rect x="212" y="278" width="132" height="6" rx="3" fill="url(#accent)"/>

  <text x="210" y="336" font-size="30" fill="#cbd5e1">A persistent, commit-tracked map of any codebase.</text>
  <text x="210" y="378" font-size="26" fill="#93a4bd">Every answer grounded in verified <tspan fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">file:line</tspan> evidence.</text>

  <!-- Output chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">
    <g>
      <rect x="210" y="424" width="212" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="236" y="451" fill="#e2e8f0">architecture.md</text>
    </g>
    <g>
      <rect x="434" y="424" width="160" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="460" y="451" fill="#e2e8f0">modules.md</text>
    </g>
    <g>
      <rect x="606" y="424" width="212" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="632" y="451" fill="#e2e8f0">entry-points.md</text>
    </g>
    <g>
      <rect x="830" y="424" width="196" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="856" y="451" fill="#e2e8f0">conventions.md</text>
    </g>
    <g>
      <rect x="210" y="480" width="164" height="42" rx="21" fill="#3b82f6" fill-opacity="0.18" stroke="#60a5fa" stroke-opacity="0.6"/>
      <text x="236" y="507" fill="#bfdbfe">index.json</text>
    </g>
    <g>
      <rect x="386" y="480" width="212" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="412" y="507" fill="#e2e8f0">scan.sh --paths</text>
    </g>
    <g>
      <rect x="610" y="480" width="216" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="636" y="507" fill="#e2e8f0">diff-check.sh</text>
    </g>
  </g>

  <text x="96" y="590" font-size="20" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Claude Skill · zero dependencies · git-aware</text>
</svg>
